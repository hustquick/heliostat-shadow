name: Multi-platform build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: maturin build --release --manifest-path rust/heliostat-core/Cargo.toml --features python-bindings --out dist/wheels
      - run: python -m pip install --force-reinstall dist/wheels/*.whl
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo test --manifest-path rust/Cargo.toml --features android-jni
      - run: node tests/playback_controls.mjs
      - run: node tests/operation_state.mjs
      - run: node tests/update_ui.mjs
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: |
          $env:PYTHON_BIN = (Get-Command python).Source
          ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/smoke_windows_server.ps1
      - shell: pwsh
        run: ./scripts/test_windows_update.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Heliostat-Viewer-Windows
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.sha256

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" "ndk;28.0.13004108"
      - run: cargo install cargo-ndk --locked
      - run: chmod +x android/gradlew scripts/build_android.sh
      - name: Restore persistent Android signing identity
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          test -n "$SIGNING_KEY"
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          echo "HELIOSTAT_ANDROID_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - run: ./scripts/build_android.sh
      - name: Verify packaged Android viewer resources
        run: |
          unzip -p dist/android/*.apk assets/viewer/index.html | grep -q 'id="viewMode"'
          unzip -p dist/android/*.apk assets/viewer/style.css | grep -q '#overview, #focus { display: none; }'
          unzip -p dist/android/*.apk assets/mobile/plant_bundle.bundle | gzip -dc | grep -q '"plants"'
      - uses: actions/upload-artifact@v4
        with:
          name: Heliostat-Viewer-Android
          path: |
            dist/android/*.apk
            dist/android/*.sha256

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install xcodegen
      - run: chmod +x scripts/build_ios.sh && ./scripts/build_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Heliostat-Viewer-iOS-Simulator
          path: |
            dist/ios/*.zip
            dist/ios/*.sha256

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: PYTHON_BIN="$(command -v python)" zsh scripts/build_macos_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Heliostat-Viewer-macOS
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
            dist/macos/*.sha256

  publish-release:
    needs: [core-and-python, windows, android, ios-simulator, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: heliostat-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests cryptography
      - uses: actions/download-artifact@v4
        with:
          pattern: Heliostat-Viewer-*
          path: release-assets
          merge-multiple: true
      - name: Publish complete version with signed update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python -m scripts.publish_release release-assets
