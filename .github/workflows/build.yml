name: Multi-platform build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: maturin build --release --manifest-path rust/heliostat-core/Cargo.toml --features python-bindings --out dist/wheels
      - run: python -m pip install --force-reinstall dist/wheels/*.whl
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo test --manifest-path rust/Cargo.toml --features android-jni
      - run: node tests/operation_state.mjs
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "8.0.x"}
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: |
          $env:PYTHON_BIN = (Get-Command python).Source
          ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/smoke_windows_server.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Heliostat-Viewer-Windows-v1.0.2
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.sha256

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" "ndk;28.0.13004108"
      - run: cargo install cargo-ndk --locked
      - run: chmod +x android/gradlew scripts/build_android.sh
      - run: ./scripts/build_android.sh
      - name: Verify packaged Android viewer resources
        run: |
          unzip -p dist/android/*.apk assets/viewer/index.html | grep -q 'id="viewMode"'
          unzip -p dist/android/*.apk assets/viewer/style.css | grep -q '#overview, #focus { display: none; }'
          unzip -p dist/android/*.apk assets/mobile/plant_bundle.bundle | gzip -dc | grep -q '"plants"'
      - uses: actions/upload-artifact@v4
        with:
          name: Heliostat-Viewer-Android-v1.0.2
          path: |
            dist/android/*.apk
            dist/android/*.sha256

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install xcodegen
      - run: chmod +x scripts/build_ios.sh && ./scripts/build_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Heliostat-Viewer-iOS-Simulator-v1.0.2
          path: |
            dist/ios/*.zip
            dist/ios/*.sha256

  publish-windows-release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Heliostat-Viewer-Windows-v1.0.2
          path: release-assets/windows
      - name: Upload packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.2 release-assets/windows/* --clobber --repo "${{ github.repository }}"

  publish-android-release:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Heliostat-Viewer-Android-v1.0.2
          path: release-assets/android
      - name: Upload packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.2 release-assets/android/* --clobber --repo "${{ github.repository }}"

  publish-ios-release:
    needs: ios-simulator
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Heliostat-Viewer-iOS-Simulator-v1.0.2
          path: release-assets/ios
      - name: Upload packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.2 release-assets/ios/* --clobber --repo "${{ github.repository }}"
